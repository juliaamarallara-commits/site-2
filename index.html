<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <style>
        /* CSS Integrado para facilidade */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FAF8F5; /* Fundo creme acolhedor */
            color: #333333;
            line-height: 1.6;
        }

        header {
            background-color: #E8F5E9; /* Verde bem suave */
            padding: 2.5rem 1rem;
            text-align: center;
            border-bottom: 2px solid #C8E6C9;
        }

        header h1 {
            font-family: 'Quicksand', sans-serif;
            color: #2E7D32;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #558B2F;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        /* Card da Mensagem de Acolhimento */
        .card-boas-vindas {
            background-color: #FFFFFF;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            border-left: 6px solid #81C784;
            margin-bottom: 2rem;
        }

        .card-boas-vindas h2 {
            font-family: 'Quicksand', sans-serif;
            color: #2E7D32;
            margin-bottom: 1rem;
            font-size: 1.6rem;
        }

        .card-boas-vindas p {
            font-size: 1.1rem;
            color: #4A4A4A;
            margin-bottom: 1rem;
        }

        .banner-imagem {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, #A5D6A7 0%, #80DEEA 100%);

            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.3rem;
            text-align: center;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
